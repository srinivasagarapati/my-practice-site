<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Delivery</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #ff4d4d;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
    }

    .card {
      background: white;
      width: 250px;
      margin: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      padding: 15px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #e60000;
    }

    #cart {
      position: fixed;
      right: 10px;
      top: 70px;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      width: 200px;
    }
  </style>
</head>
<body>

<header>
  🍕 My Food Delivery
</header>

<div id="cart">
  <h3>Cart 🛒</h3>
  <ul id="cart-items"></ul>
</div>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Pizza">
    <h3>Pizza</h3>
    <p>$10</p>
    <button onclick="addToCart('Pizza')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Burger">
    <h3>Burger</h3>
    <p>$5</p>
    <button onclick="addToCart('Burger')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Pasta">
    <h3>Pasta</h3>
    <p>$8</p>
    <button onclick="addToCart('Pasta')">Add to Cart</button>
  </div>

</div>

<script>
  function addToCart(item) {
    let list = document.getElementById("cart-items");
    let li = document.createElement("li");
    li.textContent = item;
    list.appendChild(li);
  }
</script>

</body>
</html>
